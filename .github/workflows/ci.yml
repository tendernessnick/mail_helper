name: ci

# 08 章 §3 CI：PR 触发 build+test+覆盖率门禁；release job（publish/Velopack）随 S12 落地
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MailHelper.sln

      # 0 警告红线由仓库根 Directory.Build.props 的 TreatWarningsAsErrors=true 保证
      - name: Build (Release)
        run: dotnet build MailHelper.sln -c Release --no-restore

      - name: Test (含 XPlat 覆盖率收集，排除 *.g.cs 生成代码)
        run: dotnet test MailHelper.sln -c Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # NFR-10 / G1：MailHelper.Core 行覆盖 ≥ 80%（并集语义：任一测试工程命中即算覆盖；
      # 归一化各报告 filename 前缀差异；排除 obj 下源生成器产物，D-14）
      - name: Coverage gate (MailHelper.Core >= 80%)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/coverage-gate.ps1 -Assembly MailHelper.Core -MinRate 0.80

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: error

  # 08 §3/§4：合并 main 即产生 beta 渠道产物；打 tag v*.*.* 走 stable + Inno Setup 安装包（S12）
  release:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (单文件自包含 win-x64，08 §2)
        run: >
          dotnet publish src/MailHelper.App -c Release -r win-x64
          -p:PublishSingleFile=true -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - name: Pack (Velopack beta 通道，08 §4.3)
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          vpk pack --packId MailHelper --packVersion "0.1.${{ github.run_number }}" `
            --packDirectory artifacts/publish --mainExe MailHelper.App.exe `
            --outputDir artifacts/velopack
          vpk publish --channel beta --gitHubRepo ${{ github.repository }} `
            --outputDir artifacts/velopack --releaseName "MailHelper 0.1.${{ github.run_number }} (beta)"

      - name: SHA256 校验清单（08 §4.4 无证书路径）
        shell: pwsh
        run: |
          Get-ChildItem artifacts/velopack -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File artifacts/velopack/SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velopack-beta
          path: artifacts/velopack
          if-no-files-found: error
