name: ci

# 08 章 §3 CI：PR 触发 build+test+覆盖率门禁。
# 发布链路（S15，08 §4.3）：
#   push main            → beta 渠道（GitHub Pre-release，不影响 Releases/latest）
#   打 tag v*.*.*        → stable 渠道（正式 Release，Releases/latest 指向它，应用内检查更新的数据源）
# 版本唯一事实源 = git tag（stable）/ Directory.Build.props + 构建号（beta）。
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MailHelper.sln

      # 0 警告红线由仓库根 Directory.Build.props 的 TreatWarningsAsErrors=true 保证
      - name: Build (Release)
        run: dotnet build MailHelper.sln -c Release --no-restore

      - name: Test (含 XPlat 覆盖率收集，排除 *.g.cs 生成代码)
        run: >
          dotnet test MailHelper.sln -c Release --no-build
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --logger "trx"

      # 失败时把失败用例名写进 Job Summary（公开可见）并上传 TRX，便于无 token 排查
      - name: 失败用例摘要
        if: failure()
        shell: pwsh
        run: |
          $names = Get-ChildItem -Recurse -Filter *.trx | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object { $_.testName }
          } | Select-Object -Unique
          ("### 失败用例`n" + ($names | ForEach-Object { "- ❌ $_" } | Out-String)) | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload test results (失败排查用)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # NFR-10 / G1：MailHelper.Core 行覆盖 ≥ 80%（并集语义：任一测试工程命中即算覆盖；
      # 归一化各报告 filename 前缀差异；排除 obj 下源生成器产物，D-14）
      - name: Coverage gate (MailHelper.Core >= 80%)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/coverage-gate.ps1 -Assembly MailHelper.Core -MinRate 0.80

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: error

  release:
    needs: build-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # 创建 Release 并上传产物（GITHUB_TOKEN 最小授权）
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # stable 版本 = tag 去掉 v 前缀；beta 版本 = Directory.Build.props 基线 + beta.构建号（SemVer2 可比较，逐次递增）
      - name: 计算版本与渠道
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $base = $props.Project.PropertyGroup.Version.Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $channel = 'stable'; $pre = 'false'
          } else {
            $version = "$base-beta.$($env:GITHUB_RUN_NUMBER)"
            $channel = 'beta'; $pre = 'true'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "pre=$pre"         >> $env:GITHUB_OUTPUT
          Write-Host "version=$version channel=$channel"

      # 自包含（免装 .NET）；不用单文件——Velopack 以自身压缩格式分发，单文件自解压反而拖慢启动
      - name: Publish (自包含 win-x64，版本随 tag/渠道注入)
        run: >
          dotnet publish src/MailHelper.App -c Release -r win-x64
          -p:Version=${{ steps.ver.outputs.version }}
          -p:SelfContained=true
          -o artifacts/publish

      - name: Pack (Velopack：Setup.exe + 便携 zip + 增量更新包)
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          vpk pack --packId MailHelper `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir artifacts/publish `
            --mainExe MailHelper.App.exe `
            --icon src/MailHelper.App/Assets/app.ico `
            --channel ${{ steps.ver.outputs.channel }} `
            --outputDir artifacts/velopack

      - name: SHA256 校验清单（08 §4.4 无证书路径）
        shell: pwsh
        run: |
          Remove-Item artifacts/velopack/SHA256SUMS.txt -ErrorAction SilentlyContinue
          Get-ChildItem artifacts/velopack -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File artifacts/velopack/SHA256SUMS.txt -Append -Encoding utf8
          }

      # 上传为 GitHub Release：beta 标 pre-release；--merge 允许同版本重跑合并而非报错
      # 注意 --publish/--pre/--merge 为无值开关（vpk 1.2.x System.CommandLine 风格）
      - name: Upload to GitHub Releases
        shell: pwsh
        run: |
          $vpkArgs = @(
            'upload', 'github',
            '--repoUrl', "https://github.com/${{ github.repository }}",
            '--token', "${{ secrets.GITHUB_TOKEN }}",
            '--channel', "${{ steps.ver.outputs.channel }}",
            '--publish', '--merge',
            '--releaseName', "MailHelper v${{ steps.ver.outputs.version }}",
            '--tag', "v${{ steps.ver.outputs.version }}",
            '--outputDir', 'artifacts/velopack'
          )
          if ('${{ steps.ver.outputs.pre }}' -eq 'true') { $vpkArgs += '--pre' }
          vpk @vpkArgs

      # vpk 只上传自家认识的文件：校验清单由本步追加为 Release 资产并写入 Release 说明
      # （脚本先经本地真实 API 演练；重跑时 body 去重、同名资产跳过）
      - name: Attach SHA256SUMS to Release
        shell: pwsh
        run: >
          ./tools/attach-sums.ps1
          -Token "${{ secrets.GITHUB_TOKEN }}"
          -Dir "artifacts/velopack"
          -Repo "${{ github.repository }}"
          -Tag "v${{ steps.ver.outputs.version }}"

      # 仅当发布上传失败时保留本地产物用于排查
      - name: Upload release artifacts (失败排查用)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ steps.ver.outputs.channel }}
          path: artifacts/velopack
          if-no-files-found: error
